<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nur.Prof.AI — ИИ-профориентация для школьников</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F6F0;
    --bg-soft: #EAEFE4;
    --surface: #FFFFFF;
    --border: #DFE5D6;
    --ink: #1C2B22;
    --ink-soft: #52604F;
    --violet: #3358D6;
    --violet-dark: #24409E;
    --violet-bg: #E7EDFB;
    --amber: #E8A33D;
    --amber-bg: #FCF0DC;
    --rose: #C24D5C;
    --rose-bg: #FAE6E8;
    --green: #2F7A5B;
    --green-bg: #E1F0E6;
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 26px;
    --max: 700px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  .bg-anim{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-anim span{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
  }
  .bg-anim span:nth-child(1){
    width:480px;height:480px;
    background:var(--violet-bg);
    top:-160px;left:-120px;
    animation:float1 26s ease-in-out infinite;
  }
  .bg-anim span:nth-child(2){
    width:420px;height:420px;
    background:var(--amber-bg);
    bottom:-140px;right:-100px;
    animation:float2 30s ease-in-out infinite;
  }
  .bg-anim span:nth-child(3){
    width:360px;height:360px;
    background:var(--green-bg);
    top:35%;right:10%;
    animation:float3 34s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(60px,80px) scale(1.12);}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-70px,-50px) scale(1.15);}
  }
  @keyframes float3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-40px,60px) scale(0.9);}
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    color:var(--ink);
    line-height:1.15;
    margin:0;
  }
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:var(--violet);}

  #app{
    max-width:var(--max);
    margin:0 auto;
    padding:28px 20px 90px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    max-width:var(--max);
    margin:0 auto;
    padding:22px 20px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    position:relative;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .logo{
    width:34px;height:34px;border-radius:9px;
    background:var(--violet);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo svg{width:18px;height:18px;}
  .logo-text{font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:-0.01em;}

  .lang-switch{position:relative;}
  .lang-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:100px;
    padding:8px 13px;
    font-size:14px;font-weight:600;
    color:var(--ink);
  }
  .lang-btn:hover{border-color:var(--violet);}
  .lang-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius-m);
    box-shadow:0 10px 30px rgba(28,43,34,.12);
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:150px;
    z-index:20;
  }
  .lang-opt{
    display:flex;align-items:center;gap:9px;
    padding:10px 12px;
    border-radius:var(--radius-s);
    font-size:14.5px;font-weight:600;
    color:var(--ink);
    text-align:left;
    background:transparent;
  }
  .lang-opt:hover{background:var(--bg-soft);}
  .lang-opt.active{background:var(--violet-bg);color:var(--violet-dark);}
  .lang-opt .flag{font-size:17px;margin-right:0;}

  /* ---------- progress path ---------- */
  .path-wrap{margin:34px 0 40px;}
  .path{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    position:relative;
  }
  .path::before{
    content:"";
    position:absolute;
    top:9px;left:9px;right:9px;
    height:2px;
    background:var(--border);
    z-index:0;
  }
  .path-fill{
    position:absolute;
    top:9px;left:9px;
    height:2px;
    background:var(--amber);
    z-index:1;
    transition:width .5s ease;
  }
  .node{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    width:20px;
    flex:1;
  }
  .node-dot{
    width:20px;height:20px;border-radius:50%;
    background:var(--surface);
    border:2px solid var(--border);
    transition:.3s;
  }
  .node.done .node-dot{background:var(--amber);border-color:var(--amber);}
  .node.active .node-dot{background:var(--violet);border-color:var(--violet);box-shadow:0 0 0 5px var(--violet-bg);}
  .node-label{
    margin-top:9px;font-size:11.5px;color:var(--ink-soft);
    text-align:center;max-width:72px;line-height:1.25;
  }
  .node.active .node-label{color:var(--violet);font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- hero ---------- */
  .hero{padding:8px 0 6px;}
  .kicker{
    color:var(--violet);
    font-weight:600;
    font-size:14.5px;
    margin-bottom:14px;
  }
  .hero h1{
    font-size:40px;
    letter-spacing:-0.015em;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--violet);
  }
  .hero-sub{
    margin-top:16px;
    font-size:17px;
    color:var(--ink-soft);
    max-width:52ch;
  }
  .hero-steps{
    margin-top:34px;
    display:grid;
    gap:10px;
  }
  .hero-step{
    display:flex;gap:14px;align-items:flex-start;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
  }
  .hero-step-num{
    font-family:'Space Grotesk';font-weight:600;
    color:var(--amber);
    font-size:15px;
    flex-shrink:0;
    width:22px;
  }
  .hero-step-text b{display:block;font-size:15px;margin-bottom:2px;}
  .hero-step-text span{font-size:14px;color:var(--ink-soft);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 24px;
    border-radius:100px;
    border:none;
    font-weight:600;
    font-size:15.5px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:focus-visible{outline:3px solid var(--violet-dark); outline-offset:2px;}
  .btn-primary{background:var(--violet);color:#fff;}
  .btn-primary:hover{box-shadow:0 6px 18px rgba(51,88,214,.28);}
  .btn-primary:disabled{background:#C7C2E6;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--violet);border:1.5px solid var(--violet);}
  .btn-ghost:hover{background:var(--violet-bg);}
  .btn-block{width:100%;justify-content:center;}
  .btn-row{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;}

  /* ---------- card / form ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-l);
    padding:28px 26px;
  }
  .step-title{font-size:24px;margin-bottom:6px;}
  .step-hint{color:var(--ink-soft);font-size:14.5px;margin-bottom:26px;}

  .field{margin-bottom:20px;}
  .field label{
    display:block;font-weight:600;font-size:14.5px;margin-bottom:7px;
  }
  .field .opt{font-weight:400;color:var(--ink-soft);font-size:13px;}
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border-radius:var(--radius-s);
    border:1.5px solid var(--border);
    background:var(--bg-soft);
    font-size:15px;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none;border-color:var(--violet);background:#fff;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:520px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .fieldset-title{
    font-weight:600;font-size:14.5px;margin:26px 0 4px;
    padding-top:18px;border-top:1px solid var(--border);
  }
  .fieldset-hint{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}

  /* ---------- klimov ---------- */
  .q-counter{color:var(--ink-soft);font-size:13.5px;margin-bottom:10px;}
  .q-lead{font-size:15px;color:var(--ink-soft);margin-bottom:18px;}
  .pair{display:grid;gap:12px;}
  .opt-card{
    text-align:left;
    background:var(--bg-soft);
    border:1.5px solid var(--border);
    border-radius:var(--radius-m);
    padding:18px 18px;
    font-size:15.5px;
    line-height:1.45;
    color:var(--ink);
    transition:.15s;
  }
  .opt-card:hover{border-color:var(--violet);background:var(--violet-bg);}
  .opt-card:focus-visible{outline:3px solid var(--violet-dark);}

  /* ---------- riasec ---------- */
  .riasec-item{
    padding:18px 0;
    border-bottom:1px solid var(--border);
  }
  .riasec-item:last-child{border-bottom:none;}
  .riasec-text{font-size:15.5px;margin-bottom:12px;}
  .scale{display:flex;gap:6px;}
  .scale button{
    flex:1;
    padding:10px 4px;
    border-radius:var(--radius-s);
    border:1.5px solid var(--border);
    background:var(--bg-soft);
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .scale button.picked{background:var(--violet);border-color:var(--violet);color:#fff;}
  .scale-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--ink-soft);}

  /* ---------- tags ---------- */
  .tag-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .tag{
    padding:11px 16px;
    border-radius:100px;
    border:1.5px solid var(--border);
    background:var(--bg-soft);
    font-size:14.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .tag.picked{background:var(--amber);border-color:var(--amber);color:#2B2100;}

  /* ---------- loading ---------- */
  .loading-wrap{text-align:center;padding:70px 10px;}
  .spinner{
    width:52px;height:52px;margin:0 auto 26px;
    border-radius:50%;
    border:4px solid var(--border);
    border-top-color:var(--violet);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{font-size:16px;color:var(--ink-soft);min-height:24px;}

  /* ---------- results ---------- */
  .result-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:20px 20px;
    margin-bottom:14px;
  }
  .result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .result-name{font-family:'Space Grotesk';font-weight:600;font-size:18px;}
  .result-field{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}
  .match-badge{
    flex-shrink:0;
    background:var(--green-bg);color:var(--green);
    font-weight:700;font-size:13px;
    padding:6px 11px;border-radius:100px;
  }
  .result-desc{font-size:14.5px;color:var(--ink-soft);margin-top:12px;}
  .result-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
  .mini-tag{
    font-size:12px;font-weight:600;color:var(--violet);
    background:var(--violet-bg);padding:4px 10px;border-radius:100px;
  }
  .result-actions{margin-top:16px;}

  /* ---------- universities ---------- */
  .chosen-banner{
    background:var(--violet);
    color:#fff;
    border-radius:var(--radius-l);
    padding:26px 24px;
    margin-bottom:26px;
  }
  .chosen-banner .k{font-size:13px;opacity:.75;font-weight:600;}
  .chosen-banner h2{color:#fff;font-size:25px;margin-top:6px;}
  .chosen-banner p{margin-top:10px;font-size:14.5px;opacity:.9;}

  .uni-group-title{
    font-size:13.5px;font-weight:700;color:var(--ink-soft);
    margin:26px 0 12px;
  }
  .uni-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:18px 18px;
    margin-bottom:12px;
  }
  .uni-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .uni-name{font-weight:700;font-size:15.5px;}
  .uni-country{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .flag{font-size:15px;margin-right:4px;}
  .req-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}
  .req-chip{
    font-size:12.5px;font-weight:600;
    padding:6px 10px;border-radius:8px;
    display:flex;align-items:center;gap:5px;
  }
  .req-ok{background:var(--green-bg);color:var(--green);}
  .req-warn{background:var(--amber-bg);color:#8A5F00;}
  .req-low{background:var(--rose-bg);color:var(--rose);}
  .req-na{background:var(--bg-soft);color:var(--ink-soft);}
  .uni-price{
    margin-top:11px;font-size:13px;font-weight:600;
    color:var(--violet-dark);
  }
  .uni-link{
    display:inline-flex;align-items:center;gap:5px;
    margin-top:12px;
    font-size:13.5px;font-weight:700;
    color:var(--violet);
    text-decoration:none;
  }
  .uni-link:hover{text-decoration:underline;}

  .info-banner{
    background:var(--amber-bg);
    border-radius:var(--radius-m);
    padding:16px 18px;
    font-size:14.5px;
    color:#5C4300;
    line-height:1.5;
    margin:20px 0;
  }

  .footnote{
    margin-top:30px;font-size:13px;color:var(--ink-soft);
    background:var(--bg-soft);padding:14px 16px;border-radius:var(--radius-m);
    line-height:1.5;
  }

  .back-link{
    background:none;border:none;color:var(--ink-soft);
    font-size:14px;font-weight:600;padding:0;margin-bottom:18px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-link:hover{color:var(--violet);}
</style>
</head>
<body>

<div class="bg-anim"><span></span><span></span><span></span></div>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.6"/><path d="M15 9L13 13L9 15L11 11L15 9Z" fill="white"/></svg>
    </div>
    <span class="logo-text">Nur.Prof.AI</span>
  </div>
  <div class="lang-switch" id="lang-switch">
    <button class="lang-btn" id="lang-btn" onclick="toggleLangMenu(event)"></button>
  </div>
</div>

<div id="app"></div>

<script>
/* ============ I18N ============ */

const LANG_META = {
  ru: {flag:"🇷🇺", label:"Рус"},

const UI = {

  homeLabel:{ru:"Страна проживания", en:"Country of residence", kz:"Тұратын елің"},
  targetLabel:{ru:"Куда планируешь поступать?", en:"Where do you plan to apply?", kz:"Қайда түсуді жоспарлап отырсың?"},
  countryUndecided:{ru:"Ещё не решил(а)", en:"Not decided yet", kz:"Әлі шешкен жоқпын"},

  scoresOpt:{ru:"(если уже сдавал(а) — необязательно)", en:"(if you've already taken them — optional)", kz:"(тапсырған болсаң — міндетті емес)"},

  entLabel:{ru:"ЕНТ", en:"ENT", kz:"ҰБТ"}, entOpt:{ru:"из 140", en:"out of 140", kz:"140-тен"},
  ieltsLabel:{ru:"IELTS", en:"IELTS", kz:"IELTS"}, ieltsOpt:{ru:"из 9", en:"out of 9", kz:"9-дан"},

function t(key, vars){
  const entry = UI[key];
  if(!entry) return key;
  let s = entry[S.lang] || entry.ru;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace(new RegExp("\\{"+k+"\\}","g"), vars[k]); });
  return s;
}
function L(obj, field){
  if(S.lang==="ru") return obj[field];
  return obj[field+"_"+S.lang] || obj[field];
}

function renderLangSwitch(){
  const btn = document.getElementById("lang-btn");
  if(!btn) return;
  const m = LANG_META[S.lang];
  btn.innerHTML = `<span class="flag">${m.flag}</span><span>${m.label}</span> ▾`;
}
function toggleLangMenu(e){
  e.stopPropagation();
  const wrap = document.getElementById("lang-switch");
  let menu = document.getElementById("lang-menu");
  if(menu){ menu.remove(); return; }
  menu = document.createElement("div");
  menu.className = "lang-menu";
  menu.id = "lang-menu";
  menu.innerHTML = Object.keys(LANG_META).map(code=>`
    <button class="lang-opt ${code===S.lang?'active':''}" onclick="setLang('${code}')">
      <span class="flag">${LANG_META[code].flag}</span>${LANG_META[code].label}
    </button>
  `).join("");
  wrap.appendChild(menu);
  document.addEventListener("click", closeLangMenuOnce, {once:true});
}
function closeLangMenuOnce(){
  const menu = document.getElementById("lang-menu");
  if(menu) menu.remove();
}
function setLang(code){
  S.lang = code;
  renderLangSwitch();
  const menu = document.getElementById("lang-menu");
  if(menu) menu.remove();
  render();
}

/* ---- scoring ---- */
function computeResults(){
  const klimovCount = {};
  S.klimov.forEach(k=>klimovCount[k]=(klimovCount[k]||0)+1);
  const sortedKlimov = Object.keys(klimovCount).sort((a,b)=>klimovCount[b]-klimovCount[a]);
  const top1 = sortedKlimov[0], top2 = sortedKlimov[1];

  const riasecAvg = {};
  ["R","I","A","S","E","C"].forEach(letter=>{
    const idxs = RIASEC_ITEMS.map((it,i)=>it.k===letter?i:-1).filter(i=>i>-1);
    const vals = idxs.map(i=>S.riasec[i]||3);
    riasecAvg[letter] = vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const scored = PROFESSIONS.map(p=>{
    let score = 0;
    if(p.klimov===top1) score += 10;
    else if(p.klimov===top2) score += 5;
    p.riasec.forEach(letter=>{ score += riasecAvg[letter]*2.2; });
    const overlap = p.tags.filter(t=>S.tags.includes(t)).length;
    score += overlap*7;
    return {...p, score};
  });

  const maxScore = Math.max(...scored.map(s=>s.score));
  scored.forEach(s=>{ s.match = Math.round(Math.min(97, 55 + (s.score/maxScore)*42)); });
  scored.sort((a,b)=>b.score-a.score);
  S.results = scored.slice(0,6);
}

      ${S.results.map(r=>`

          <div class="result-top">
            <div>
              <div class="result-name">${r.name}</div>
              <div class="result-field">${r.field} · ${KLIMOV_LABEL[r.klimov]}</div>
            </div>
            <div class="match-badge">${r.match}% совпадение</div>
          </div>
          <div class="result-desc">${r.desc}</div>
          <div class="result-tags">${r.tags.map(t=>`<span class="mini-tag">${TAGS.find(x=>x.k===t).l}</span>`).join("")}</div>
          <div class="result-actions">
            <button class="btn btn-ghost" onclick="startTrial('${r.id}')">🎯 Попробовать профессию</button>
            <button class="btn btn-ghost" onclick="chooseProfession('${r.id}')">Выбрать эту профессию →</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="footnote">Это демо-версия: профессии подбираются по упрощённой модели прямо в браузере, без реального ИИ-сервиса. В полной версии здесь будет более глубокий анализ на базе языковой модели.</div>
  `;
}
function chooseProfession(id){
  S.chosen = PROFESSIONS.find(p=>p.id===id);
  goStep("universities");
}

/* ---- trial: проба профессии ---- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function startTrial(id){
  S.trialFor = id;
  const p = PROFESSIONS.find(x=>x.id===id);
  const task = TRIAL_TASKS[p.field];
  S.trialQuestions = shuffleArray(task.questions).map(q=>({
    task: q.task,
    opts: shuffleArray(q.opts),
  }));
  S.trialQIdx = 0;
  S.trialAnswers = [];
  S.trialFeedback = null;
  goStep("trial");
}
function pickTrialOption(idx){
  const q = S.trialQuestions[S.trialQIdx];
  S.trialAnswers.push(q.opts[idx].correct);
  S.trialQIdx++;
  renderTrial();
}
function setTrialFeedback(val){
  S.trialFeedback = val;
  renderTrial();
}
function renderTrial(){
  const p = PROFESSIONS.find(x=>x.id===S.trialFor);
  const task = TRIAL_TASKS[p.field];

  if(S.trialQIdx < S.trialQuestions.length){
    const q = S.trialQuestions[S.trialQIdx];
    app.innerHTML = `
      <button class="back-link" onclick="goStep('results')">← Назад к профессиям</button>
      <div class="card">
        <div class="q-counter">Проба профессии · Вопрос ${S.trialQIdx+1} из ${S.trialQuestions.length}</div>
        <h2 class="step-title">${p.name}</h2>
        <p class="q-lead" style="white-space:pre-line;">${q.task}</p>
        <div class="pair">
          ${q.opts.map((o,i)=>`<button class="opt-card" onclick="pickTrialOption(${i})">${o.t}</button>`).join("")}
        </div>
      </div>
    `;
    return;
  }

  const correctCount = S.trialAnswers.filter(Boolean).length;

  if(S.trialFeedback===null){
    app.innerHTML = `
      <div class="card">
        <div class="q-counter">Проба профессии · ${p.name}</div>
        <h2 class="step-title">Верно ${correctCount} из ${S.trialQuestions.length}</h2>
        <p class="step-hint">${correctCount===S.trialQuestions.length ? "Отлично — ты рассуждаешь так же, как рассуждают в этой профессии каждый день." : "Часть вопросов оказалась непростой — это нормально, в реальной работе тоже учатся на практике."}</p>
        <div class="info-banner">${task.day}</div>
        <div class="fieldset-title" style="border-top:none;padding-top:0;">Тебе понравилось это задание?</div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-ghost" onclick="setTrialFeedback('yes')">Да, было интересно</button>
          <button class="btn btn-ghost" onclick="setTrialFeedback('meh')">Более-менее</button>
          <button class="btn btn-ghost" onclick="setTrialFeedback('no')">Не моё</button>
        </div>
      </div>
    `;
    return;
  }

  const fbText = S.trialFeedback==="yes" ? "Отлично — это хороший знак, что профессия тебе подходит."
    : S.trialFeedback==="meh" ? "Окей, это нормально — не всё в профессии одинаково увлекательно."
    : "Понял. Такое тоже важно знать до поступления, а не после первого курса.";

  app.innerHTML = `
    <div class="card">
      <h2 class="step-title">Спасибо за пробу!</h2>
      <p class="step-hint">${fbText} Мы учли это в твоём профиле.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="goStep('results')">← Вернуться к профессиям</button>
        <button class="btn btn-primary" onclick="chooseProfession('${p.id}')">Выбрать эту профессию → вузы</button>
      </div>
    </div>
  `;
}

/* ---- universities ---- */
function reqChip(label, req, userVal){
  if(req===undefined) return "";
  if(!userVal) return `<span class="req-chip req-na">${label}: минимум ~${req}</span>`;
  const uv = parseFloat(userVal);
  if(uv >= req) return `<span class="req-chip req-ok">${label} ✓ соответствует (нужно ~${req})</span>`;
  if(uv >= req*0.88) return `<span class="req-chip req-warn">${label} ⚠ погранично (нужно ~${req})</span>`;
  return `<span class="req-chip req-low">${label} ↑ стоит подтянуть (нужно ~${req})</span>`;
}
function renderUniversities(){
  const p = S.chosen;
  const unis = FIELD_UNIS[p.field] || [];
  const target = unis.filter(u=>u.c===S.target);
  const others = unis.filter(u=>u.c!==S.target);

  function uniCard(u){
    return `
      <div class="uni-card">
        <div class="uni-top">
          <div>
            <div class="uni-name"><span class="flag">${COUNTRY[u.c].f}</span>${u.name}</div>
            <div class="uni-country">${COUNTRY[u.c].n} · направление «${p.field}»</div>
          </div>
        </div>
        <div class="req-row">
          ${reqChip("ЕНТ", u.reqEnt, S.scoreEnt)}
          ${reqChip("IELTS", u.reqIelts, S.scoreIelts)}
          ${reqChip("SAT", u.reqSat, S.scoreSat)}
        </div>
        ${u.price ? `<div class="uni-price">💰 ${u.price}</div>` : ""}
        ${u.url ? `<a class="uni-link" href="${u.url}" target="_blank" rel="noopener noreferrer">Официальный сайт ↗</a>` : ""}
      </div>`;
  }

  app.innerHTML = `
    <button class="back-link" onclick="goStep('results')">← Назад к профессиям</button>
    <div class="chosen-banner">
      <div class="k">Твой выбор</div>
      <h2>${p.name}</h2>
      <p>${p.desc}</p>
    </div>

    ${target.length ? `<div class="uni-group-title">В стране, куда ты планируешь поступать — ${COUNTRY[S.target] ? COUNTRY[S.target].n : ''}</div>${target.map(uniCard).join("")}` : ""}
    <div class="uni-group-title">${target.length ? "Другие сильные варианты" : "Университеты по направлению «"+p.field+"»"}</div>
    ${others.map(uniCard).join("")}

    <div class="footnote">Баллы и цены — примерные ориентиры для демо-версии, а не официальные данные вузов. Перед подачей документов всегда сверяйся с актуальными требованиями на сайте университета.</div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goStep('results')">Выбрать другую профессию</button>
      <button class="btn btn-primary" onclick="goStep('prepPlan')">📅 Составить план подготовки</button>
    </div>
    <div class="btn-row" style="margin-top:6px;">
      <button class="back-link" onclick="restart()">↺ Начать заново</button>
    </div>
  `;
}

/* ---- prep plan: план подготовки ---- */
function methodTextForPlatform(platform){
  const map = {
    tiktok: "смотри короткие видео-объяснения (10–15 минут) по теме, затем сразу закрепляй 5 практическими задачами",
    instagram: "найди пару каналов/блогов по теме в Reels, разбей материал на карточки-заметки и повторяй их между делами",
    youtube: "смотри один разбор темы на YouTube (15–20 минут) и сразу решай практику по нему",
    games: "превращай повторение в игру — используй карточки в стиле Anki/Quizlet и соревнуйся сам с собой в счёте",
    telegram: "подпишись на 2–3 канала по теме и веди короткий конспект в заметках телефона",
    books: "читай главу учебника с конспектом, а затем перескажи материал своими словами вслух",
    offline: "слушай аудио-объяснения или подкасты по теме во время прогулки или тренировки",
  };
  return map[platform] || "выбери формат объяснения, который тебе удобнее всего, и закрепляй практикой";
}
function renderPrepPlan(){
  const p = S.chosen;
  const subjects = SUBJECTS_BY_FIELD[p.field] || ["Профильные предметы"];
  const platforms = S.platforms.length ? S.platforms : ["offline"];
  const methods = platforms.map(k=>({
    label: (PLATFORM_OPTIONS.find(x=>x.k===k)||{}).l || k,
    text: methodTextForPlatform(k)
  }));
  const hours = S.prepHours ? `${S.prepHours} ч/день` : "20–40 минут в день";
  const days = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];

  const schedule = days.map((d,i)=>{
    const subject = subjects[i % subjects.length];
    const method = methods[i % methods.length];
    const isRest = i===6;
    return {day:d, subject: isRest ? "Отдых / лёгкое повторение" : subject, method, rest:isRest};
  });

  app.innerHTML = `
    <button class="back-link" onclick="goStep('universities')">← Назад к вузам</button>
    <div class="chosen-banner">
      <div class="k">План подготовки</div>
      <h2>${p.name}</h2>
      <p>Подстроено под то, что тебе удобно: ${hours}, форматы — ${methods.map(m=>m.label).join(", ")}.</p>
    </div>

    <div class="info-banner">Общий принцип: чередуем форматы, которые ты сам(а) выбрал(а), чтобы подготовка не превращалась в рутину — ${methods.map(m=>m.text).join("; ")}.</div>

    <div class="uni-group-title">Расписание на неделю</div>
    ${schedule.map(s=>`
      <div class="uni-card">
        <div class="uni-top">
          <div>
            <div class="uni-name">${s.day}</div>
            <div class="uni-country">${s.subject}</div>
          </div>
        </div>
        ${!s.rest ? `<div class="uni-price">🎯 ${s.method.label}: ${s.method.text}</div>` : `<div class="uni-price">🌿 Дай себе передышку — мозгу нужно время закрепить материал</div>`}
      </div>
    `).join("")}

    <div class="footnote">Это шаблон плана для демо-версии. В полной версии ИИ будет подстраивать план каждую неделю под твой реальный прогресс и результаты пробных тестов.</div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goStep('universities')">Назад к вузам</button>
      <button class="btn btn-primary" onclick="restart()">Начать заново</button>
    </div>
  `;
}

function restart(){
  S.step="welcome"; S.age=""; S.home="KZ"; S.target="KZ";
  S.scoreEnt=""; S.scoreIelts=""; S.scoreSat="";
  S.klimovIdx=0; S.klimov=[]; S.riasec={}; S.tags=[];
  S.platforms=[]; S.prepHours="";
  S.results=[]; S.chosen=null;
  S.trialFor=null; S.trialQuestions=[]; S.trialQIdx=0; S.trialAnswers=[]; S.trialFeedback=null;
  render();
}

function goStep(step){ S.step=step; render(); }

renderLangSwitch();
render();
</script>
